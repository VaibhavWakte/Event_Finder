{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EVENT FINDER</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <style>
    /* Global Styles */
    body {
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
        background-size: 400% 400%;
        animation: gradientBG 20s ease infinite;
    }

    @keyframes gradientBG {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    main {
        padding: 30px 20px;
        min-height: 80vh;
    }

    /* Navbar */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(90deg, #ff6f61, #ffb347);
        padding: 15px 30px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .navbar a {
        text-decoration: none;
        color: white;
        font-weight: bold;
        margin-left: 20px;
        font-size: 1.1em;
        transition: 0.3s;
    }

    .navbar a:hover {
        color: #333;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        transform: scale(1.05);
    }

    .navbar a:first-child {
        font-size: 1.5em;
        color: white;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    /* Headings */
    h1, h2, h3 {
        color: #ff6f61;
        text-align: center;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }

    /* Links inside main */
    main a {
        color: #ff6f61;
        text-decoration: none;
        transition: 0.3s;
    }

    main a:hover {
        text-decoration: underline;
        color: #ff3b2f;
    }

    /* Buttons (if any inside main) */
    .btn {
        display: inline-block;
        padding: 10px 20px;
        margin: 10px 5px 10px 0;
        border-radius: 25px;
        background: linear-gradient(45deg, #ff6f61, #ffb347);
        color: white;
        font-weight: bold;
        text-decoration: none;
        transition: 0.3s;
    }

    .btn:hover {
        background: linear-gradient(45deg, #ff3b2f, #ff9a3f);
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    /* Responsive */
    @media (max-width: 768px) {
        .navbar {
            flex-direction: column;
            align-items: flex-start;
        }

        .navbar nav {
            margin-top: 10px;
        }
    }
  </style>
</head>
<body>
<header class="navbar">
  <a href="{% url 'home' %}">EVENT FINDER</a>
  <nav>
    <a href="{% url 'add_event' %}">Add Event</a>
  </nav>
  <nav>
    <a href="{% url 'join_event' %}">JOIN Event</a>
  </nav>

</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
