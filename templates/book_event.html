<!DOCTYPE html>
{% extends "base.html" %}
{% block content %}

<style>
/* 🌸 Soft, Modern, Light Theme */
.book-container {
    max-width: 750px;
    margin: 50px auto;
    background: linear-gradient(135deg, #cc9292, #e0f7fa, #fce4ec);
    background-size: 200% 200%;
    animation: colorFlow 10s ease infinite;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    text-align: center;
    transition: all 0.3s ease;
}

@keyframes colorFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.book-container:hover {
    transform: scale(1.02);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
}

/* 🎀 Heading Styles */
.book-container h2 {
    color: #2c3e50;
    font-size: 2em;
    font-weight: 700;
    margin-bottom: 15px;
    text-shadow: 1px 1px 3px rgba(255,255,255,0.6);
}

.book-container p {
    color: #555;
    font-size: 1.1em;
    margin-bottom: 30px;
    font-weight: 500;
}

/* 🪄 Form Styles */
form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

form p {
    width: 85%;
    text-align: left;
    color: #444;
    font-weight: 500;
}

input[type="text"],
input[type="email"],
input[type="number"],
input[type="date"],
select,
textarea {
    width: 100%;
    padding: 12px 15px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background-color: #ffffff;
    color: #333;
    font-size: 1em;
    transition: 0.3s;
    box-shadow: 0 3px 6px rgba(0,0,0,0.05);
}

input:focus, select:focus, textarea:focus {
    border-color: #80deea;
    box-shadow: 0 0 10px rgba(128,222,234,0.5);
    outline: none;
    transform: scale(1.02);
}

/* 💎 Button */
button[type="submit"] {
    background: linear-gradient(90deg, #a1c4fd, #c2e9fb);
    color: #2c3e50;
    padding: 12px 40px;
    border: none;
    border-radius: 30px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.4s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

button[type="submit"]:hover {
    background: linear-gradient(90deg, #fbc2eb, #a6c1ee);
    transform: scale(1.07);
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

/* 🌼 Responsive */
@media (max-width: 600px) {
    .book-container {
        padding: 25px;
    }

    .book-container h2 {
        font-size: 1.7em;
    }

    form p {
        width: 100%;
    }
}
</style>

<div class="book-container">
    <h2>Book Event: {{ event.title }}</h2>
    <p>Date: {{ event.date }} | Time: {{ event.time }} | Location: {{ event.location }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Book Now</button>
    </form>
</div>

{% endblock %}
